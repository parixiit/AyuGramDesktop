name: Build Linux Binary

on:
  push:
    branches:
      - feature/anti-restrictions
      - feature/top-bar-avatar
      - feature/modern-layout
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build AyuGram Desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-
          save-always: true

      - name: Prepare Build Container
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest
          docker build -t tdesktop:centos_env - << 'DOCKEREOF'
          FROM ghcr.io/telegramdesktop/tdesktop/centos_env:latest
          USER root
          RUN bash -c 'set -e && \
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && \
            source $HOME/.cargo/env && \
            git clone --depth 1 https://github.com/dkaraush/tlottie.git /usr/src/tlottie && \
            cd /usr/src/tlottie && \
            git clone --depth 1 https://github.com/desktop-app/patches.git /usr/src/patches && \
            (git apply /usr/src/patches/tlottie.patch || true) && \
            cargo rustc --lib --release --features c-api --crate-type staticlib --target x86_64-unknown-linux-gnu && \
            mkdir -p /usr/local/lib /usr/local/include/tlottie && \
            cp target/x86_64-unknown-linux-gnu/release/libtlottie.a /usr/local/lib/libtlottie.a && \
            cp include/tlottie.h /usr/local/include/tlottie/tlottie.h && \
            rm -rf /usr/src/tlottie /usr/src/patches'
          DOCKEREOF

      - name: Build AyuGram Desktop
        run: |
          mkdir -p ${{ runner.temp }}/.tdesktop-cache
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            -v "${{ runner.temp }}/.tdesktop-cache:/var/cache/ccache" \
            -e CONFIG=Release \
            -e CCACHE_DIR=/var/cache/ccache \
            tdesktop:centos_env \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D TDESKTOP_API_TEST=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Package Binary
        run: |
          mkdir -p package
          BINARY=$(find out -type f \( -name "AyuGram" -o -name "Telegram" \) -executable | head -n 1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find out -type f \( -name "AyuGram" -o -name "Telegram" \) | head -n 1)
          fi
          echo "Found binary at: $BINARY"
          cp "$BINARY" package/AyuGram
          strip package/AyuGram || true
          tar -czvf ayugram-linux-x86_64.tar.gz -C package AyuGram

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-linux-x86_64
          path: ayugram-linux-x86_64.tar.gz
          retention-days: 14
